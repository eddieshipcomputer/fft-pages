<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="30">
<title>FFT Engine Status</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .header h1 { font-size: 1.4rem; color: #58a6ff; }
  .uptime { color: #8b949e; font-size: 0.9rem; }
  .summary { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
  .card { background: #161b22; padding: 15px 20px; border-radius: 8px; border: 1px solid #30363d; }
  .card .label { color: #8b949e; font-size: 0.8rem; text-transform: uppercase; }
  .card .value { font-size: 1.5rem; font-weight: bold; margin-top: 4px; }
  .card .value.profit { color: #3fb950; }
  .card .value.loss { color: #f85149; }
  table { width: 100%; border-collapse: collapse; background: #161b22; border-radius: 8px; overflow: hidden; }
  th { background: #21262d; padding: 10px; text-align: left; font-size: 0.8rem; color: #8b949e; text-transform: uppercase; }
  td { padding: 10px; border-top: 1px solid #21262d; font-size: 0.9rem; }
  td.strat { font-weight: bold; color: #58a6ff; }
  td.dir.long { color: #3fb950; }
  td.dir.short { color: #f85149; }
  td.dir.flat { color: #8b949e; }
  td.eq { text-align: right; }
  td.pos { font-family: monospace; font-size: 0.85rem; }
  .risk { margin-top: 15px; padding: 10px; background: #161b22; border-radius: 8px; border: 1px solid #30363d; }
  .sr-section { margin-top: 15px; padding: 15px; background: #161b22; border-radius: 8px; border: 1px solid #30363d; }
  .sr-section h2 { font-size: 1rem; color: #58a6ff; margin-bottom: 10px; }
  .sr-grid { display: flex; gap: 15px; flex-wrap: wrap; }
  .sr-card { flex: 1; min-width: 180px; padding: 12px; border-radius: 6px; background: #0d1117; border: 1px solid #30363d; }
  .sr-card .sr-label { color: #8b949e; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .sr-card .sr-price { font-size: 1.4rem; font-weight: bold; margin-top: 4px; font-family: monospace; }
  .sr-card.ceiling .sr-price { color: #f85149; }
  .sr-card.floor .sr-price { color: #3fb950; }
  .sr-card .sr-meta { color: #8b949e; font-size: 0.8rem; margin-top: 4px; }
  .sr-card .sr-kind { display: inline-block; padding: 2px 6px; border-radius: 3px; background: #21262d; font-size: 0.7rem; color: #c9d1d9; }
  .sr-card .sr-strength { color: #d29922; }
  .tv-chart-section { margin-top: 15px; background: #161b22; border-radius: 8px; border: 1px solid #30363d; overflow: hidden; }
  .tv-chart-section h2 { font-size: 1rem; color: #58a6ff; padding: 15px 15px 0; }
  .tv-chart-container { width: 100%; height: 400px; }
</style>
</head>
<body>
  <div class="header">
    <h1>⚡ FFT Engine</h1>
    <span class="uptime">Last update: 38h 47m</span>
  </div>
  
<div class="tv-chart-section">
        <h2>📈 BTC/USDT Live Chart</h2>
        <div class="tv-chart-container">
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
            {
              "autosize": true,
              "symbol": "BINANCE:BTCUSDT",
              "interval": "60",
              "timezone": "UTC",
              "theme": "dark",
              "style": "1",
              "locale": "en",
              "enable_publishing": false,
              "hide_top_toolbar": false,
              "hide_legend": false,
              "allow_symbol_change": false,
              "save_image": false,
              "calendar": false,
              "hide_volume": false,
              "support_host": "https://www.tradingview.com"
            }
            </script>
        </div>
    </div>
<div class="summary">
<div class="card"><div class="label">Total Equity</div><div class="value">$75.87</div></div>
<div class="card"><div class="label">Daily PnL</div><div class="value profit">$+0.00</div></div>
<div class="card"><div class="label">Risk</div><div class="value profit">OK</div></div>
<div class="card"><div class="label">Strategies</div><div class="value">1</div></div>
<div class="card"><div class="label">Uptime</div><div class="value">38h 47m</div></div>
</div>
<table>
<thead><tr><th>Strategy</th><th>Dir</th><th>Equity</th><th>Position</th><th>Bars</th></tr></thead>
<tbody><tr><td class="strat">meanrev_5m</td><td class="dir flat">FLAT</td><td class="eq">$75.87</td><td class="pos">FLAT</td><td>0</td></tr></tbody>
</table>
<p style="margin-top:10px;color:#8b949e;font-size:0.8rem">Last update: 04:50:01 UTC</p>
</body>
</html>
